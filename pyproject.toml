[project]
name = "quant"
version = "0.1.0"
description = "A 股数据与量化分析（akshare / pandas / pyarrow / matplotlib）"
readme = "README.md"
authors = [
    { name = "云", email = "1420079678-ctrl" }
]
requires-python = ">=3.12"
dependencies = [
    "akshare",
    "matplotlib",
    "numpy",
    "pandas",
    "pyarrow",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
